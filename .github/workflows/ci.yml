name: CI - Account Service

on:
  push:
    branches:
      - main
      - feature/account-service-hexagonal
  pull_request:
    branches:
      - main
      
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: account_db
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U banking -d account_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4      

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'   
         
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify   