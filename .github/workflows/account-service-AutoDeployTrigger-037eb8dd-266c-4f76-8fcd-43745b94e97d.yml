name: Trigger auto deployment for account-service

on:
  push:
    branches:
      - feature/account-service-hexagonal
    paths:
      - '**'
      - '.github/workflows/account-service-AutoDeployTrigger-037eb8dd-266c-4f76-8fcd-43745b94e97d.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application with Maven
        run: ./mvnw clean package -DskipTests

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACCOUNTSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACCOUNTSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACCOUNTSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.ACCOUNTSERVICE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACCOUNTSERVICE_REGISTRY_PASSWORD }}
          containerAppName: account-service
          resourceGroup: rg-banking-hexagonal-dev
          imageToBuild: sidney123789/account-service-hexagonal:${{ github.sha }}